name: Site checks

"on":
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-checks:
    name: site-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find "New Perfection" -type f -name '*.js' -print0)
          echo "Checked $count JavaScript file(s)."

      - name: Check for conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -nE '^(<{7}( |$)|={7}$|>{7}( |$))' -- .; then
            echo "::error::Git conflict markers found"
            exit 1
          fi
          echo "No conflict markers found."

      - name: Check local resources
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const siteRoot = path.resolve('New Perfection');
          const errors = [];
          let htmlCount = 0;
          let refCount = 0;

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name === 'node_modules' || entry.name === '.git') continue;
                walk(full, out);
              } else if (entry.isFile()) {
                out.push(full);
              }
            }
            return out;
          }

          function exactExists(target) {
            const root = path.parse(target).root;
            const parts = path.relative(root, target).split(path.sep).filter(Boolean);
            let current = root;
            for (const part of parts) {
              if (!fs.existsSync(current)) return false;
              if (!fs.readdirSync(current).includes(part)) return false;
              current = path.join(current, part);
            }
            return true;
          }

          function isExternal(ref) {
            const value = ref.trim();
            if (!value || value.startsWith('#')) return true;
            return /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(value);
          }

          function cleanRef(ref) {
            let value = ref.trim().split('#')[0].split('?')[0];
            try {
              value = decodeURIComponent(value);
            } catch {
              return null;
            }
            return value;
          }

          function checkReference(htmlFile, attr, ref) {
            if (isExternal(ref)) return;
            const value = cleanRef(ref);
            if (!value) return;
            const target = value.startsWith('/')
              ? path.join(siteRoot, value.replace(/^\/+/, ''))
              : path.resolve(path.dirname(htmlFile), value);
            const relative = path.relative(siteRoot, target);
            if (relative.startsWith('..') || path.isAbsolute(relative)) {
              errors.push(`Outside site root: ${path.relative(process.cwd(), htmlFile)} -> ${ref}`);
              return;
            }
            refCount += 1;
            if (!exactExists(target)) {
              errors.push(`Missing local resource: ${path.relative(process.cwd(), htmlFile)} -> ${ref}`);
              return;
            }
            if (fs.statSync(target).isDirectory()) {
              if (attr !== 'href') {
                errors.push(`Expected file but found directory: ${path.relative(process.cwd(), htmlFile)} -> ${ref}`);
                return;
              }
              if (!exactExists(path.join(target, 'index.html'))) {
                errors.push(`Missing index.html for directory link: ${path.relative(process.cwd(), htmlFile)} -> ${ref}`);
              }
            }
          }

          const files = walk(siteRoot);
          const attributePattern = /\b(src|href|poster)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi;
          const srcsetPattern = /\bsrcset\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi;

          for (const file of files.filter((name) => name.toLowerCase().endsWith('.html'))) {
            htmlCount += 1;
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(attributePattern)) {
              checkReference(file, match[1].toLowerCase(), match[2] ?? match[3] ?? match[4] ?? '');
            }
            for (const match of html.matchAll(srcsetPattern)) {
              const value = match[1] ?? match[2] ?? match[3] ?? '';
              if (value.includes('data:')) continue;
              for (const candidate of value.split(',')) {
                const ref = candidate.trim().split(/\s+/)[0];
                if (ref) checkReference(file, 'src', ref);
              }
            }
          }

          if (errors.length > 0) {
            for (const error of errors) console.error(`::error::${error}`);
            console.error(`\n${errors.length} problem(s) found.`);
            process.exit(1);
          }

          console.log(`Checked ${htmlCount} HTML file(s) and ${refCount} local reference(s).`);
          NODE
